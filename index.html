<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>World Restaurant Chooser</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
        background-color: #f0f0f0;
      }
      #board {
        background-color: #333;
        color: #fff;
        padding: 10px;
        font-size: clamp(14px, 4vw, 24px); /* Dynamic font sizing */
        cursor: pointer;
        text-align: center;
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        max-width: 100%;
        box-sizing: border-box;
      }

      .cell {
        flex: 0 1 24px;
        height: 36px;
        background-color: #222;
        margin: 0 1px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      .cell.emoji {
        flex: 0 1 45px;
        font-size: clamp(20px, 6vw, 36px);
      }

      @media (max-width: 480px) {
        .cell {
          flex: 0 1 12px; /* Very compact cells for narrow screens */
          height: 28px;
          margin: 0 1px;
        }
        .cell.emoji {
          flex: 0 1 32px;
        }
      }
      .cell-content {
      }
      .image-container {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .image-item {
        width: 300px;
        margin: 20px;
        text-align: center;
      }
      .image-item img {
        max-width: 100%;
        max-height: 300px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 6px;
      }
      .image-caption {
        margin-top: 8px;
        font-size: 14px;
        word-wrap: break-word;
        text-align: center;
      }
      .image-caption a {
        color: #0645ad;
        text-decoration: none;
      }
      .image-caption a:hover {
        text-decoration: underline;
      }
      .dish-title {
        font-weight: bold;
        margin-bottom: 4px;
      }
      .dish-description {
        font-size: 12px;
        color: #555;
        margin-top: 4px;
        text-align: left;
      }
      #world-map {
        width: 300px;
        height: 150px;
        background-color: #a4d1ff;
      }
      #world-map svg {
        width: 100%;
        height: 100%;
      }
      #world-map .country {
        fill: #c0c0c0;
        stroke: #ffffff;
        stroke-width: 0.5;
      }
      #world-map .country.selected {
        fill: #ff6b6b;
      }
      #world-map .country-circle {
        fill: none;
        stroke: #ff6b6b;
        stroke-width: 1;
      }
    </style>

      function createBoard(length) {
        board.innerHTML = "";
        for (let i = 0; i < length; i++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          const cellContent = document.createElement("div");
          cellContent.className = "cell-content";
          cell.appendChild(cellContent);
          board.appendChild(cell);
        }
      }

      function flipAnimation(duration, callback) {
        const cells = document.querySelectorAll(".cell-content");
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ ";
        let start = null;

        function step(timestamp) {
          if (!start) start = timestamp;
          const progress = timestamp - start;

          cells.forEach((cell, index) => {
            if (index === 0) {
              const randomCountry =
                countries[Math.floor(Math.random() * countries.length)];
              cell.textContent = randomCountry.flag;
            } else {
              cell.textContent =
                characters[Math.floor(Math.random() * characters.length)];
            }
            cell.style.top = `${Math.random() * 30 - 15}px`;
          });

          if (progress < duration) {
            window.requestAnimationFrame(step);
          } else {
            callback();
          }
        }
        window.requestAnimationFrame(step);
      }

      async function getCuisineData(country) {
        const areaName = mealDbAreaMap[country.name] || country.name;
        const cuisineData = [];

        // Load the cuisine summary from Wikipedia
        const titlesToTry = [
          `Cuisine_of_${encodeURIComponent(country.name)}`,
          `${encodeURIComponent(country.name)}_cuisine`
        ];

        for (const title of titlesToTry) {
          try {
            const response = await fetch(
              `https://en.wikipedia.org/api/rest_v1/page/summary/${title}`
            );
            if (response.ok) {
              const data = await response.json();
              cuisineData.push({
                  title: data.title,
                  image: data.thumbnail ? data.thumbnail.source : null,
                  description: data.extract,
                  link: data.content_urls ? data.content_urls.desktop.page : `https://en.wikipedia.org/wiki/${title}`
              });
              break;
            }
          } catch (e) {
            console.warn(`Wikipedia lookup failed for ${title}:`, e);
          }
        }

        // Attempt to fetch specific dishes from TheMealDB
        try {
          const response = await fetch(
            `https://www.themealdb.com/api/json/v1/1/filter.php?a=${encodeURIComponent(areaName)}`
          );
          if (response.ok) {
            const data = await response.json();
            if (data.meals && data.meals.length > 0) {
              // Pick 2 random dishes from available recipes
              const shuffled = [...data.meals].sort(() => 0.5 - Math.random());
              const selected = shuffled.slice(0, 2);
              cuisineData.push(...selected.map((dish) => ({
                title: dish.strMeal,
                image: dish.strMealThumb,
                description: "Popular regional dish",
                link: `https://www.google.com/search?q=${encodeURIComponent(dish.strMeal + " recipe")}`
              })));
            }
          }
        } catch (e) {
          console.warn("TheMealDB lookup failed:", e);
        }
        return cuisineData;
      }

      async function loadWorldMap() {
        const response = await fetch(
          "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"
        );
        return await response.json();
      }

        const cells = document.querySelectorAll(".cell");

        cells.forEach((cell) => {

          cell.style.width = "30px";
        });
        cellContents.forEach((content) => {
          content.textContent = "";
          content.style.top = "0";
        });

        cells[0].classList.add("emoji");
        cells[0].style.width = "60px";
        cellContents[0].textContent = country.flag;

        country.name.split("").forEach((char, index) => {
          if (cellContents[index + 1]) {
            cellContents[index + 1].textContent = char;
          }
        });

        const imageContainer = document.createElement("div");
        imageContainer.className = "image-container";
        imageContainer.innerHTML = "";

        // Add world map card
        const mapItem = document.createElement("div");
        mapItem.className = "image-item";
        const worldMap = document.createElement("div");
        worldMap.id = "world-map";
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );
        svg.setAttribute("width", "300");
        svg.setAttribute("height", "150");
        worldMap.appendChild(svg);
        mapItem.appendChild(worldMap);
        imageContainer.appendChild(mapItem);

        try {
          const worldData = await loadWorldMap();
          if (worldData) {
            const width = 300;
            const height = 150;
            const projection = d3
              .geoNaturalEarth1()
              .fitSize([width, height], { type: "Sphere" });
            const path = d3.geoPath().projection(projection);

            const background = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "path"
            );
            background.setAttribute("d", path({ type: "Sphere" }));
            background.setAttribute("fill", "#a4d1ff");
            svg.appendChild(background);

            const countriesFeature = topojson.feature(
              worldData,
              worldData.objects.countries
            );

            const smallCountryThreshold = 20;
            const smallSelectedCountries = [];

            countriesFeature.features.forEach((feature) => {
              const countryPath = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
              );
              countryPath.setAttribute("d", path(feature));

              const featureCountryName = feature.properties.name;
              const isSelected =
                featureCountryName.toLowerCase() === country.name.toLowerCase();

              countryPath.classList.add("country");
              if (isSelected) {
                countryPath.classList.add("selected");
              }

              svg.appendChild(countryPath);

              const bounds = path.bounds(feature);
              const dx = bounds[1][0] - bounds[0][0];
              const dy = bounds[1][1] - bounds[0][1];
              const isSmall =
                dx < smallCountryThreshold && dy < smallCountryThreshold;

              if (isSmall && isSelected) {
                smallSelectedCountries.push(feature);
              }
            });

            smallSelectedCountries.forEach((feature) => {
              const centroid = path.centroid(feature);
              const circle = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
              );
              circle.setAttribute("cx", centroid[0]);
              circle.setAttribute("cy", centroid[1]);
              circle.setAttribute("r", smallCountryThreshold);
              circle.classList.add("country-circle");
              svg.appendChild(circle);
            });
          }
        } catch (error) {
          console.error("Error rendering world map:", error);
          worldMap.textContent = "Error loading map";
        }

        const mapCaption = document.createElement("div");
        mapCaption.className = "image-caption";
        const wikiLink = document.createElement("a");
        wikiLink.href = `https://en.wikipedia.org/wiki/${encodeURIComponent(country.name)}`;
        wikiLink.textContent = "Wikipedia";
        wikiLink.target = "_blank";
        mapCaption.appendChild(wikiLink);
        mapItem.appendChild(mapCaption);

        // Fetch and display food/cuisine items
        const foodItems = await getCuisineData(country);
        foodItems.forEach((item) => {
          const itemDiv = document.createElement("div");
          itemDiv.className = "image-item";

          if (item.image) {
            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.title;
            itemDiv.appendChild(img);
          }

          const caption = document.createElement("div");
          caption.className = "image-caption";

          const titleEl = document.createElement("div");
          titleEl.className = "dish-title";
          titleEl.textContent = item.title;
          caption.appendChild(titleEl);

          if (item.description) {
            const descEl = document.createElement("div");
            descEl.className = "dish-description";
            descEl.textContent = item.description;
            caption.appendChild(descEl);
          }

          if (item.link) {
            const link = document.createElement("a");
            link.href = item.link;
            link.target = "_blank";
            link.textContent = " Learn More";
            caption.appendChild(link);
          }

          itemDiv.appendChild(caption);
          imageContainer.appendChild(itemDiv);
        });

        result.innerHTML = "";
        result.appendChild(imageContainer);
      }

      createBoard(25);

      board.addEventListener("click", () => {
        result.innerHTML = "";
        flipAnimation(1000, () => {
          const selectedCountry = getRandomCountry();
          displayCountry(selectedCountry);
        });
      });
    </script>
  </body>
</html>
